# Grafana 알림 → Discord 팀 서버. 웹훅 URL은 .env의 DISCORD_WEBHOOK_URL(Parameter Store /memme/v2/monitoring/discord-webhook)에서만 주입
apiVersion: 1
contactPoints:
  - orgId: 1
    name: discord-memme
    receivers:
      - uid: discord-memme
        type: discord
        settings:
          url: $DISCORD_WEBHOOK_URL
          avatar_url: ""
          use_discord_username: false
        disableResolveMessage: false

# 기본 정책의 수신처를 Discord로 지정 (그룹 묶음 30초, 같은 알림 반복 4시간)
policies:
  - orgId: 1
    receiver: discord-memme
    group_by: ["grafana_folder", "alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
