services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${STATE_DIR:-./runtime}:/etc/nginx/conf.d:ro
    networks: [internal]

  backend-blue:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped
    env_file: .runtime.env
    environment:
      SERVER_PORT: "8080"
    networks: [internal]

  backend-green:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped
    env_file: .runtime.env
    environment:
      SERVER_PORT: "8080"
    networks: [internal]

networks:
  internal:
    driver: bridge
