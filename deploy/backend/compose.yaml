services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./.runtime.nginx.conf:/etc/nginx/nginx.conf:ro
      - ${STATE_DIR:-./runtime}:/etc/nginx/conf.d:ro
      - ${ACME_WEBROOT:-/opt/memme/acme-challenge}:/var/www/acme:ro
      - ${TLS_CERT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    networks: [internal]

  backend-blue:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped
    env_file: .runtime.env
    environment:
      SERVER_PORT: "8080"
    networks: [internal]

  backend-green:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped
    env_file: .runtime.env
    environment:
      SERVER_PORT: "8080"
    networks: [internal]

networks:
  internal:
    driver: bridge
