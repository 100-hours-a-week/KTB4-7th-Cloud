events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    include /etc/nginx/conf.d/upstream.conf;

    map $http_origin $cors_origin {
        default "";
        "https://memme-fe.dydwn507.workers.dev" $http_origin;
    }

    map $http_origin $cors_allowed {
        default 0;
        "" 1;
        "https://memme-fe.dydwn507.workers.dev" 1;
    }

    server {
        listen 80;
        server_name api.memme.kr;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            try_files $uri =404;
        }

        location / {
            return 301 https://api.memme.kr$request_uri;
        }
    }

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://app_upstream;
        }
    }

    server {
        listen 8081;
        server_name localhost;

        location = /health {
            proxy_set_header Host $host;
            proxy_pass http://app_upstream;
        }
    }

    server {
        listen 443 ssl;
        server_name api.memme.kr;
        ssl_certificate /etc/letsencrypt/live/api.memme.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.memme.kr/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        if ($cors_allowed = 0) {
            return 403;
        }

        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
                add_header Vary Origin always;
                return 204;
            }

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin "";
            proxy_pass http://app_upstream;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Vary Origin always;
        }
    }
}
