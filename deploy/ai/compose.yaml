services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${STATE_DIR:-./runtime}/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
    networks: [internal]

  ai-blue:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped
    env_file: .runtime.env
    environment:
      PORT: "8000"
    networks: [internal]

  ai-green:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped
    env_file: .runtime.env
    environment:
      PORT: "8000"
    networks: [internal]

networks:
  internal:
    driver: bridge
