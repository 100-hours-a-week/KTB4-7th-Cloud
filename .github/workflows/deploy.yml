name: Deploy service

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        type: choice
        options: [backend, ai, frontend]

permissions:
  contents: read

concurrency:
  group: cd-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.service }}
    if: github.ref == 'refs/heads/main' && inputs.service != 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest successful dev CI
        id: ci
        env:
          SERVICE: ${{ inputs.service }}
        run: python3 deploy/resolve-latest-ci.py "$SERVICE" >> "$GITHUB_OUTPUT"

      - name: Resolve target
        id: target
        shell: bash
        run: |
          case '${{ inputs.service }}' in
            backend)
              echo 'instance_id=${{ vars.BACKEND_INSTANCE_ID }}' >> "$GITHUB_OUTPUT"
              echo 'repository=${{ vars.BACKEND_ECR_REPOSITORY }}' >> "$GITHUB_OUTPUT"
              echo 'secret_id=${{ vars.BACKEND_RUNTIME_SECRET_ID }}' >> "$GITHUB_OUTPUT"
              ;;
            ai)
              echo 'instance_id=${{ vars.AI_INSTANCE_ID }}' >> "$GITHUB_OUTPUT"
              echo 'repository=${{ vars.AI_ECR_REPOSITORY }}' >> "$GITHUB_OUTPUT"
              echo 'secret_id=${{ vars.AI_RUNTIME_SECRET_ID }}' >> "$GITHUB_OUTPUT"
              ;;
          esac
          test -n "$(tail -n 1 "$GITHUB_OUTPUT")"

      - name: Validate immutable deployment target
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.ci.outputs.commit_sha }}
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          REPOSITORY: ${{ steps.target.outputs.repository }}
          SECRET_ID: ${{ steps.target.outputs.secret_id }}
        run: |
          [[ "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$INSTANCE_ID" =~ ^i-[a-f0-9]{17}$ ]]
          [[ "$REPOSITORY" == memme/* ]]
          [[ "$SECRET_ID" == /memme/prod/*/runtime ]]

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve immutable ECR image
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ steps.target.outputs.repository }}
          COMMIT_SHA: ${{ steps.ci.outputs.commit_sha }}
        run: |
          digest="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$COMMIT_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Run Blue-Green deployment through SSM
        id: command
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ steps.target.outputs.repository }}@${{ steps.image.outputs.digest }}
          COMMIT_SHA: ${{ steps.ci.outputs.commit_sha }}
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          RUNTIME_SECRET_ID: ${{ steps.target.outputs.secret_id }}
          CLOUD_SHA: ${{ github.sha }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          # shellcheck disable=SC2034
          export SERVICE IMAGE COMMIT_SHA INSTANCE_ID RUNTIME_SECRET_ID CLOUD_SHA AWS_REGION AWS_ACCOUNT_ID
          python3 - <<'PY' > command.json
          import json
          import os
          import shlex

          service = os.environ["SERVICE"]
          base = f"/opt/memme/{service}"
          q = shlex.quote
          commands = [
              "set -Eeuo pipefail",
              f"base={q(base)}",
              "mkdir -p /opt/memme",
              "for required in git docker aws python3; do command -v \"$required\" >/dev/null || { echo \"Required command is missing: $required\" >&2; exit 2; }; done",
              f"if [ ! -d {q(base + '/.git')} ]; then git clone --no-checkout https://github.com/100-hours-a-week/KTB4-7th-Cloud.git {q(base)}; fi",
              f"git -C {q(base)} fetch --depth=1 origin {q(os.environ['CLOUD_SHA'])}",
              f"git -C {q(base)} checkout --detach --force {q(os.environ['CLOUD_SHA'])}",
              f"export AWS_REGION={q(os.environ['AWS_REGION'])} AWS_ACCOUNT_ID={q(os.environ['AWS_ACCOUNT_ID'])}",
              f"bash {q(base + '/deploy/' + service + '/deploy.sh')} {q(os.environ['IMAGE'])} {q(os.environ['COMMIT_SHA'])} {q(os.environ['RUNTIME_SECRET_ID'])}",
          ]
          print(json.dumps({
              "DocumentName": "AWS-RunShellScript",
              "InstanceIds": [os.environ["INSTANCE_ID"]],
              "Parameters": {"commands": commands},
              "CloudWatchOutputConfig": {"CloudWatchOutputEnabled": True},
              "Comment": f"memme {service} Blue-Green deployment",
          }))
          PY
          command_id="$(aws ssm send-command --cli-input-json file://command.json --query 'Command.CommandId' --output text)"
          echo "command_id=${command_id}" >> "$GITHUB_OUTPUT"
          echo "SSM command: ${command_id}"

      - name: Wait for deployment
        shell: bash
        env:
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
        run: |
          for _ in $(seq 1 90); do
            status="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '{status:Status,error:StandardErrorContent}' --output json >&2
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM command ${COMMAND_ID}" >&2
          exit 1

      - name: Record deployment
        if: always()
        shell: bash
        run: |
          {
            echo "## Deployment record"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Service | \`${{ inputs.service }}\` |"
            echo "| Source commit | \`${{ steps.ci.outputs.commit_sha }}\` |"
            echo "| CI run | ${{ steps.ci.outputs.ci_run_url }} |"
            echo "| Image digest | \`${{ steps.image.outputs.digest }}\` |"
            echo "| Cloud configuration commit | \`${{ github.sha }}\` |"
            echo "| SSM command | \`${{ steps.command.outputs.command_id }}\` |"
            echo "| Result | \`${{ job.status }}\` |"
            echo "| Time (UTC) | \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: Deploy frontend
    if: github.ref == 'refs/heads/main' && inputs.service == 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest successful frontend dev CI
        id: ci
        run: python3 deploy/resolve-latest-ci.py frontend >> "$GITHUB_OUTPUT"

      - name: Check out verified frontend source
        uses: actions/checkout@v4
        with:
          repository: 100-hours-a-week/KTB4-7th-FE
          ref: ${{ steps.ci.outputs.commit_sha }}
          path: frontend-source
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-source/package-lock.json

      - name: Build frontend
        working-directory: frontend-source
        env:
          VITE_API_BASE_URL: https://api.memme.kr
        run: |
          npm ci
          npm run build

      - name: Verify Cloudflare configuration
        env:
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$ACCOUNT_ID"
          test -n "$API_TOKEN"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend-source
          command: deploy

      - name: Verify frontend routes
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --output /dev/null https://memme.kr/
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --header 'Sec-Fetch-Mode: navigate' --output /dev/null https://memme.kr/password-reset

      - name: Record frontend deployment
        if: always()
        run: |
          {
            echo "## Frontend deployment record"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Service | \`frontend\` |"
            echo "| Source commit | \`${{ steps.ci.outputs.commit_sha }}\` |"
            echo "| CI run | ${{ steps.ci.outputs.ci_run_url }} |"
            echo "| Cloud configuration commit | \`${{ github.sha }}\` |"
            echo "| Result | \`${{ job.status }}\` |"
            echo "| Time (UTC) | \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
