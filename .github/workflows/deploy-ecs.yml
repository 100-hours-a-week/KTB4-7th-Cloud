name: Deploy Backend ECS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: deploy an explicit image, previous to undo the last release (web and batch), or rollback to a recorded revision
        required: true
        type: choice
        options: [deploy, previous, rollback]
      target:
        description: all deploys web and batch together; rollback restores one target
        required: true
        type: choice
        options: [all, web, batch]
      source_sha:
        description: Full 40-character Backend dev SHA already published by CI (deploy only)
        required: false
        type: string
      task_definition:
        description: Recorded revision of the selected target, e.g. memme-backend-v2:16 (rollback only)
        required: false
        type: string

permissions:
  contents: read

# Serialize Backend EC2 and ECS deployments using the existing CD group.
concurrency:
  group: cd-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test deployment and recovery guards
        run: python3 -m unittest discover -s tests -v
      - name: Check deployment gate
        if: inputs.mode == 'deploy'
        env:
          ENABLED: ${{ vars.BACKEND_ECS_CD_ENABLED }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          # Production images still carry the Redis session and DB pool patches that Backend dev lacks.
          # Enable this variable only after those patches are merged into dev and published by CI.
          if [[ "$ENABLED" != 'true' ]]; then
            echo 'BACKEND_ECS_CD_ENABLED is not true; deploying a dev CI image would drop the Redis session and DB pool patches.' >&2
            exit 1
          fi
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'source_sha must be a full 40-character SHA' >&2; exit 1; }
      - name: Configure ECS deployment credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::613538400341:role/GitHubActionsBackendECSDeployRole
          aws-region: ap-northeast-2
      - name: Deploy or restore Backend ECS
        env:
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TASK_DEFINITION: ${{ inputs.task_definition }}
        shell: bash
        run: |
          case "$MODE" in
            deploy)
              python3 deploy/ecs/deploy_backend.py deploy --target "$TARGET" --source-sha "$SOURCE_SHA"
              ;;
            previous)
              python3 deploy/ecs/deploy_backend.py previous --target all
              ;;
            rollback)
              python3 deploy/ecs/deploy_backend.py rollback --target "$TARGET" --task-definition "$TASK_DEFINITION"
              ;;
            *) exit 2 ;;
          esac
      - name: Preserve deployment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecs-deployment-${{ github.run_id }}
          path: ecs-deployment-result.json
          if-no-files-found: warn
          retention-days: 14
